[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vlm-event-verification"
version = "0.1.0"
description = "Candidate-level Qwen3-VL verification for medication video events"
requires-python = ">=3.10,<3.14"
dependencies = ["pydantic>=2.11,<3", "medication-contracts==0.1.0"]

[project.optional-dependencies]
inference = ["transformers==4.57.6", "torch>=2.6,<3", "Pillow>=11,<13", "av>=14,<17", "accelerate>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "Pillow>=11,<13", "av>=14,<17"]

[project.scripts]
vlm-verify = "vlm_verification.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_verification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../shared/contracts/src"]

[tool.uv.sources]
medication-contracts = { path = "../../shared/contracts", editable = true }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
