[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "medication-session-video"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = ["medication-contracts==0.1.0", "av>=14,<17", "Pillow>=11,<13", "numpy>=1.26,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/session_video"]

[tool.uv.sources]
medication-contracts = { path = "../../shared/contracts", editable = true }
medication-authentication-tracking = { path = "../authentication-tracking", editable = true }
medication-event-detection = { path = "../event-detection", editable = true }
medication-session-decision = { path = "../session-decision", editable = true }
medication-pipeline = { path = "../../runtime", editable = true }
vlm-event-verification = { path = "../vlm-event-detection", editable = true }
